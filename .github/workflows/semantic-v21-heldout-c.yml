name: V21 prospective source C and matched semantic baseline

on:
  push:
    branches:
      - research/semantic-v21-heldout-c-20261029
  workflow_dispatch:

jobs:
  heldout-source-c:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . pytest
      - name: Confirm bounded V21 regression stays green
        run: python -m unittest -v research.semantic_v21.test_bounded_materialization research.semantic_v21.test_source_c_trial
      - name: Fetch frozen source C without tuning
        run: |
          git clone https://github.com/pytoolz/toolz.git /tmp/toolz-v21-c
          git -C /tmp/toolz-v21-c checkout --detach 451af60dec590a6010e2babdbf391ea8f815122f
          python -m pip install -e /tmp/toolz-v21-c
      - name: Uninspected source C and equal-information acquisition
        run: PYTHONUNBUFFERED=1 PYTHONPATH=. python research/semantic_v21/source_c_trial.py discover
      - name: Independent 1,093-case source-C oracle
        run: PYTHONPATH=. python research/semantic_v21/source_c_trial.py verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-v21-heldout-c
          path: v21_out/
