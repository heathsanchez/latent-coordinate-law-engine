name: Consequence Development Kernel
on:
  push:
    branches: [research/consequence-development-kernel-v1]
  pull_request:
  workflow_dispatch:
jobs:
  finite-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Full regression
        run: python -m pytest -q
      - name: Consequential obstruction, verified construction and ablation
        run: python -m latent_law.developmental
      - name: Untrusted engine adapter and independent verifier
        run: python -m latent_law.coordinate_adapter
